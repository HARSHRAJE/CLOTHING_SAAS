name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'BACKEND/**'
  pull_request:
    branches: [main]
    paths:
      - 'BACKEND/**'

jobs:
  build-auth-service:
    name: Build auth-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND/services/auth-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-auth-${{ hashFiles('BACKEND/services/auth-service/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-auth-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

