version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  shop-service:
    build: ./services/shop-service
    container_name: shop-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  product-service:
    build: ./services/product-service
    container_name: product-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      - postgres

  order-service:
    build: ./services/order-service
    container_name: order-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
      SHOP_SERVICE_URL: http://shop-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8085
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - auth-service

  customer-service:
    build: ./services/customer-service
    container_name: customer-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8085
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - auth-service

  inquiry-service:
    build: ./services/inquiry-service
    container_name: inquiry-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inquiry_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
      SHOP_SERVICE_URL: http://shop-service:8082
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - auth-service

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8087
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8087:8087"
    depends_on:
      - postgres
      - auth-service

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8088
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - auth-service

  media-service:
    build: ./services/media-service
    container_name: media-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8089
      JWT_SECRET: ${JWT_SECRET}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    ports:
      - "8089:8089"
    depends_on:
      - postgres
      - auth-service
    volumes:
      - C:/Users/USER/AppData/Roaming/gcloud:/root/.config/gcloud


volumes:
  postgres_data:
