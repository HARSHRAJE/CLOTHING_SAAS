version: '3.8'

# 1. Custom internal network for secure communication
networks:
  app-network:
    driver: bridge

# 2. Reusable extensions
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-spring-app: &spring-app
  networks:
    - app-network
  logging: *default-logging
  deploy:
    resources:
      limits:
        memory: 768M
      reservations:
        memory: 256M
  restart: unless-stopped

services:
  # ==========================================
  # Infrastructure (Databases & Messaging)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    networks:
      - app-network
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
    # Removed ports directive for security. Only accessible on app-network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5



  # ==========================================
  # Microservices
  # ==========================================
  api-gateway:
    <<: *spring-app
    build: ./gateway/api-gateway
    container_name: api-gateway
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080" # Exposed to the host
    depends_on:
      auth-service:
        condition: service_started

  auth-service:
    <<: *spring-app
    build: ./services/auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  shop-service:
    <<: *spring-app
    build: ./services/shop-service
    container_name: shop-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
  product-service:
    <<: *spring-app
    build: ./services/product-service
    container_name: product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET}
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    <<: *spring-app
    build: ./services/order-service
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
      SHOP_SERVICE_URL: http://shop-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  customer-service:
    <<: *spring-app
    build: ./services/customer-service
    container_name: customer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8085
      JWT_SECRET: ${JWT_SECRET}
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  inquiry-service:
    <<: *spring-app
    build: ./services/inquiry-service
    container_name: inquiry-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inquiry_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8086
      JWT_SECRET: ${JWT_SECRET}
      SHOP_SERVICE_URL: http://shop-service:8082
      ANALYTICS_SERVICE_URL: http://analytics-service:8087
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  analytics-service:
    <<: *spring-app
    build: ./services/analytics-service
    container_name: analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8087
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  notification-service:
    <<: *spring-app
    build: ./services/notification-service
    container_name: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8088
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  media-service:
    <<: *spring-app
    build: ./services/media-service
    container_name: media-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8089
      JWT_SECRET: ${JWT_SECRET}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcloud/application_default_credentials.json
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - C:/Users/USER/AppData/Roaming/gcloud:/app/gcloud:ro


volumes:
  postgres_data:
