server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      # Route definitions
      routes:
        # Auth service — public (login/register), no JWT required
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        # Shop service
        - id: shop-service
          uri: ${SHOP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/shops/**

        # Product service
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/products/**,/categories/**

        # Order service
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/orders/**

        # Customer service
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/customers/**

        # Inquiry service
        - id: inquiry-service
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/inquiries/**

        # Analytics service
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/analytics/**

        # Notification service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/notifications/**

        # Media service
        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/media/**

        # Public storefront — orders (must be before product catch-all)
        - id: store-orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/store/*/orders/**

        # Public storefront — inquiries
        - id: store-inquiries
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/store/*/inquiries/**

        # Public storefront — products (catch-all)
        - id: store-products
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/store/**

# JWT config — same secret as auth-service
jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info


