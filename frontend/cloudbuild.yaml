steps:
  # Build the container image and pass the NEXT_PUBLIC_API_URL build arg
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_GAR_URL}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--build-arg'
      - 'BACKEND_API_URL=${_BACKEND_API_URL}'
      - '.'
    dir: 'frontend'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GAR_URL}/${_SERVICE_NAME}:${COMMIT_SHA}'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_GAR_URL}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'BACKEND_API_URL=${_BACKEND_API_URL}'

substitutions:
  _GAR_URL: 'asia-south1-docker.pkg.dev/project-487b1c28-a9ba-47d0-850/cloud-run-source-deploy'
  _SERVICE_NAME: 'frontend'
  _REGION: 'asia-south1'
  _API_URL: '/api'
  _BACKEND_API_URL: 'https://api-gateway-507952736973.asia-south1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
